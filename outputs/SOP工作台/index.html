<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOP 工作台</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="appbar"><div class="brand"><img id="brandLogo" alt="SOP 工作台"><div><strong>SOP 工作台</strong><small>本地编写 · 公司版式</small></div></div><div class="doc-heading"><strong id="projectTitle"></strong><span id="saveState">正在打开</span></div><div class="actions"><button id="undoBtn" title="撤销最近的内容或页面操作">撤销</button><button id="newBtn">新建</button><button id="importBtn">导入</button><button id="saveBtn">保存项目</button><button id="docxBtn">导出 Word</button><button id="pdfBtn" class="primary">预览 / PDF</button></div></header>
<div class="workspace">
<aside class="sidebar"><div class="side-title"><span>文档结构</span><span id="pageCount" class="badge"></span></div><div class="segmented"><button id="processView" class="active">按工序</button><button id="pageView">按页面</button></div><div id="navList" class="nav-list"></div><div class="side-actions"><button id="addBtn">＋ 新增工序页</button><button id="continueBtn">＋ 当前工序续页</button></div><div class="side-footer"><button id="metaBtn">文档信息</button><button id="settingsBtn">固定格式</button><button id="helpBtn">使用说明</button></div></aside>
<main class="editor"><div class="editor-heading"><div><small id="selectedContext"></small><h1 id="editorTitle"></h1></div><div class="row"><button id="upBtn" title="当前正文页向前移动一页">↑</button><button id="downBtn" title="当前正文页向后移动一页">↓</button><button id="moveBtn">移动到…</button><button id="copyBtn">复制</button><button id="deleteBtn" class="danger-quiet">删除页</button></div></div><div class="tabs"><button data-tab="content" class="active">图文内容</button><button data-tab="quality">物料与检验</button></div><div id="editContent"></div><div class="editor-bottom"><span id="layoutHint"></span><button id="previewAllBtn">查看整份 SOP →</button></div></main>
<section class="preview-panel"><div class="preview-heading"><div><strong>公司版式预览</strong><small id="previewCaption"></small></div><button id="zoomBtn">放大</button></div><div id="previewStage"></div></section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="importFile" type="file" accept=".docx,.json,.sop" hidden><input id="photoFile" type="file" accept="image/*" multiple hidden><input id="replaceFile" type="file" accept="image/*" hidden>
<dialog id="formDialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close-dialog" aria-label="关闭">×</button></div><div id="dialogBody"></div><div class="dialog-foot"><button class="close-dialog">取消</button><button id="dialogApply" class="primary">保存</button></div></dialog>
<dialog id="photoDialog" class="photo-dialog"><div class="dialog-head"><div><h2>图片标注</h2><small>拖动画箭头、圈选或裁剪；文字工具点击图片落点。</small></div><button id="closePhoto" aria-label="关闭">×</button></div><div class="annotation-tools"><button data-tool="arrow" class="active">箭头</button><button data-tool="circle">圈选</button><button data-tool="text">文字</button><button data-tool="crop">裁剪</button><input id="annotationText" value="关键位置" aria-label="标注文字"><input id="annotationColor" type="color" value="#e22d32" aria-label="标注颜色"><button id="markUndo">撤销标注</button><button id="rotatePhoto">旋转 90°</button><button id="applyCrop">应用裁剪</button></div><div class="canvas-wrap"><canvas id="annotationCanvas"></canvas></div><div class="dialog-foot"><span id="cropHint"></span><button id="savePhoto" class="primary">保存图片标注</button></div></dialog>
<dialog id="previewDialog" class="preview-dialog"><div class="dialog-head"><div><h2>整份 SOP 预览</h2><small id="fullCount"></small></div><div class="row"><button id="printBtn" class="primary">打印 / 保存为 PDF</button><button id="closePreview">返回编辑</button></div></div><div id="fullPreview"></div></dialog>
<div id="printRoot"></div><div id="measureRoot" aria-hidden="true"></div>
<script src="vendor/jszip.min.js"></script><script src="assets.js"></script><script src="app.js"></script><script src="native-shapes.js"></script><script src="word.js"></script>
</body></html>
