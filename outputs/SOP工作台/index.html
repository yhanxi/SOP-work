<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOP 工作台 · 新模板</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace-controls.css"></head>
<body>
<header class="appbar"><div class="brand"><img id="brandLogo" alt="SOP 工作台"><div><strong>SOP 工作台</strong><small>页面 · 图文画布 · 流程图</small></div></div><div class="doc-heading"><strong id="projectTitle"></strong><span id="saveState">正在打开</span></div><div class="actions"><button id="undoBtn" title="撤销最近的内容或页面操作">撤销</button><button id="newBtn" disabled>新建</button><button id="importBtn" disabled>打开 / 导入</button><button id="saveBtn" title="保存到当前项目文件（Ctrl+S）" disabled>保存</button><button id="saveAsBtn" title="另存为新的项目文件（Ctrl+Shift+S）" disabled>另存为</button><button id="docxBtn">导出 Word</button><button id="pdfBtn" class="primary">预览 / PDF</button></div></header>
<div class="workspace">
<aside class="sidebar"><div class="side-title"><span>文档结构</span><span id="pageCount" class="badge"></span></div><div class="segmented"><button id="processView" class="active">按工序</button><button id="pageView">按页面</button></div><div id="navList" class="nav-list"></div><div class="side-actions"><button id="addBtn">＋ 新增工序页</button><button id="continueBtn" hidden aria-hidden="true" tabindex="-1">＋ 当前工序续页</button></div><div class="side-footer"><button id="metaBtn">文档信息</button><button id="settingsBtn">固定格式</button><button id="updateBtn" hidden>软件更新</button><button id="helpBtn">使用说明</button></div></aside>
<main class="editor"><div class="editor-heading"><div><small id="selectedContext"></small><h1 id="editorTitle"></h1></div><div class="row"><button id="upBtn" title="当前正文页向前移动一页">↑</button><button id="downBtn" title="当前正文页向后移动一页">↓</button><button id="moveBtn">移动到…</button><button id="copyBtn">复制</button><button id="deleteBtn" class="danger-quiet">删除页</button></div></div><div class="tabs"><button data-tab="content" class="active">图文内容</button><button data-tab="quality">物料与检验</button></div><div id="editContent"></div><div class="editor-bottom"><span id="layoutHint"></span><button id="previewAllBtn">查看整份 SOP →</button></div></main>
<section class="preview-panel"><div class="preview-heading"><div><strong>页面工作区</strong><small id="previewCaption"></small></div><button id="zoomBtn">放大</button></div><div id="previewStage"></div></section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="importFile" type="file" accept=".docx,.json,.sop" hidden><input id="photoFile" type="file" accept="image/*" multiple hidden><input id="replaceFile" type="file" accept="image/*" hidden>
<dialog id="formDialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close-dialog" aria-label="关闭">×</button></div><div id="dialogBody"></div><div class="dialog-foot"><button class="close-dialog">取消</button><button id="dialogApply" class="primary">保存</button></div></dialog>
<dialog id="photoDialog" class="photo-dialog"><div class="dialog-head"><div><h2>图片标注</h2><small>拖动画箭头、圈选或裁剪；文字工具点击图片落点。</small></div><button id="closePhoto" aria-label="关闭">×</button></div><div class="annotation-tools"><button data-tool="arrow" class="active">箭头</button><button data-tool="circle">圈选</button><button data-tool="rect">矩形</button><button data-tool="line">直线</button><button data-tool="text">文字</button><button data-tool="crop">裁剪</button><input id="annotationText" value="关键位置" aria-label="标注文字"><input id="annotationColor" type="color" value="#e22d32" aria-label="标注颜色"><label>文字背景<input id="annotationBackground" type="color" value="#fff7b7"></label><label><input id="annotationTransparent" type="checkbox">透明背景</label><label>字号<select id="annotationSize"><option value="0.025">小</option><option value="0.036" selected>中</option><option value="0.05">大</option><option value="0.07">特大</option></select></label><button id="markUndo">撤销标注</button><button id="rotatePhoto">旋转 90°</button><button id="applyCrop">应用裁剪</button></div><div id="annotationPresets" class="annotation-presets"><div><span>文字 / 线条</span><div id="textColorPresets" class="color-presets" role="group" aria-label="文字颜色预设"></div></div><div><span>文字背景</span><div id="backgroundPresets" class="color-presets" role="group" aria-label="背景颜色预设"></div></div></div><div class="canvas-wrap"><canvas id="annotationCanvas"></canvas></div><div class="dialog-foot"><span id="cropHint"></span><button id="savePhoto" class="primary">保存图片标注</button></div></dialog>
<dialog id="previewDialog" class="preview-dialog"><div class="dialog-head"><div><h2>整份 SOP 预览</h2><small id="fullCount"></small></div><div class="row"><button id="printBtn" class="primary">打印 / 保存为 PDF</button><button id="closePreview">返回编辑</button></div></div><div id="fullPreview"></div></dialog>
<div id="printRoot"></div><div id="measureRoot" aria-hidden="true"></div>
<script src="vendor/jszip.min.js"></script><script src="assets.js"></script><script src="native-import.js"></script><script src="template-v2.js"></script><script src="color-picker.js"></script><script src="object-workspace.js"></script><script src="project-storage.js"></script><script src="app.js"></script><script src="native-shapes.js"></script><script src="word.js"></script>
<script src="desktop-updates.js"></script>
</body></html>
